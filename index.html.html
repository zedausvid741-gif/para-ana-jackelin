<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ana Jackelin ❤️</title>
<style>
:root{
  --black:#040205;
  --black2:#0b0508;
  --red:#b80f2f;
  --red2:#ef274d;
  --ruby:#ff526c;
  --wine:#4d0718;
  --gold:#d9ae6a;
  --cream:#f7e9dc;
  --muted:#c8aeb4;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% 35%,rgba(190,10,45,.14),transparent 25%),
    radial-gradient(circle at 15% 80%,rgba(100,0,25,.12),transparent 30%),
    #030205;
  color:#fff;
  font-family:Georgia,"Times New Roman",serif;
}
body::before{
  content:"";
  position:fixed;inset:-25%;
  pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,30,65,.08),transparent 20%),
    radial-gradient(circle at 20% 20%,rgba(255,60,90,.06),transparent 20%),
    radial-gradient(circle at 80% 80%,rgba(120,0,30,.08),transparent 20%);
  filter:blur(45px);
  animation:ambient 12s ease-in-out infinite alternate;
}
@keyframes ambient{to{transform:scale(1.08) rotate(2deg);opacity:.8}}

#app{
  min-height:100vh;
  position:relative;
  z-index:2;
}
.scene{
  min-height:100vh;
  padding:38px 22px;
  display:none;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}
.scene.active{
  display:flex;
  animation:sceneIn .9s cubic-bezier(.2,.7,.2,1);
}
@keyframes sceneIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}

.scene-inner{
  width:min(1100px,100%);
  position:relative;
  z-index:4;
  text-align:center;
}
.eyebrow{
  font-size:13px;
  letter-spacing:5px;
  text-transform:uppercase;
  color:#e7a0ad;
  margin-bottom:18px;
}
h1{
  font-size:clamp(42px,7vw,88px);
  line-height:.98;
  margin-bottom:22px;
  text-shadow:0 0 28px rgba(255,45,80,.18);
}
.subtitle{
  max-width:720px;
  margin:0 auto 34px;
  font-size:20px;
  line-height:1.8;
  color:#eadcdf;
}
.gold{color:var(--gold)}
.red{color:#ff6b83}
.romantic-title{
  position:relative;
  display:inline-block;
}
.romantic-title::before,.romantic-title::after{
  content:"✦";
  position:absolute;
  color:#ff6b83;
  font-size:18px;
  animation:twinkle 2s infinite alternate;
}
.romantic-title::before{left:-34px;top:8px}
.romantic-title::after{right:-34px;bottom:6px}
@keyframes twinkle{to{opacity:.25;transform:scale(.65) rotate(35deg)}}

.btn{
  appearance:none;border:none;
  padding:14px 26px;border-radius:999px;
  color:white;
  font:inherit;font-size:16px;
  cursor:pointer;
  border:1px solid rgba(255,90,120,.5);
  background:linear-gradient(135deg,rgba(135,0,35,.72),rgba(33,3,10,.84));
  box-shadow:0 10px 35px rgba(90,0,25,.3),inset 0 0 20px rgba(255,50,80,.06);
  transition:.3s;
  position:relative;overflow:hidden;
}
.btn:hover{transform:translateY(-3px) scale(1.03);border-color:#ff637f;box-shadow:0 16px 40px rgba(130,0,35,.35)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn::after{
  content:"";
  position:absolute;top:-80%;left:-35%;width:25%;height:260%;
  background:rgba(255,255,255,.12);
  transform:rotate(25deg);
  transition:.65s;
}
.btn:hover::after{left:120%}

.decor{
  position:absolute;
  pointer-events:none;
  z-index:2;
  opacity:.75;
}
.decor.badge{
  display:flex;align-items:center;gap:8px;
  padding:9px 13px;border:1px solid rgba(255,110,135,.2);
  background:rgba(50,2,10,.34);
  border-radius:999px;
  color:#e6b4bd;font-size:11px;letter-spacing:1.7px;
  text-transform:uppercase;
  box-shadow:inset 0 0 18px rgba(255,40,70,.04);
}
.badge-a{left:5%;top:12%;transform:rotate(-8deg);animation:floaty 6s infinite ease-in-out}
.badge-b{right:5%;top:16%;transform:rotate(7deg);animation:floaty 7s 1s infinite ease-in-out}
.badge-c{left:7%;bottom:13%;transform:rotate(6deg);animation:floaty 6.5s .5s infinite ease-in-out}
.badge-d{right:7%;bottom:15%;transform:rotate(-7deg);animation:floaty 5.7s 1.2s infinite ease-in-out}
@keyframes floaty{50%{transform:translateY(-12px) rotate(2deg)}}

.particles,.stars,.petals{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;
}
.particles i,.stars i,.petals i{
  position:absolute;display:block;border-radius:50%;
  animation:drift linear infinite;
}
.particles i{width:4px;height:4px;background:#d94a63;box-shadow:0 0 8px rgba(255,45,75,.65);opacity:.45}
.stars i{width:2px;height:2px;background:#f8dce2;box-shadow:0 0 8px #ff6a82;animation:starPulse 2.5s ease-in-out infinite alternate}
.petals i{
  width:16px;height:9px;border-radius:100% 0;
  background:linear-gradient(135deg,#8b0a28,#e83a58);
  filter:drop-shadow(0 0 5px rgba(230,20,60,.35));
  animation:petalFall linear infinite;
}
@keyframes drift{to{transform:translate3d(80px,-110px,0);opacity:0}}
@keyframes starPulse{to{opacity:.9;transform:scale(1.8)}}
@keyframes petalFall{
  0%{transform:translate3d(0,-80px,0) rotate(0)}
  35%{transform:translate3d(35px,35vh,0) rotate(110deg)}
  70%{transform:translate3d(-28px,68vh,0) rotate(225deg)}
  100%{transform:translate3d(50px,115vh,0) rotate(350deg)}
}

/* HERO */
.hero-heart{
  width:180px;height:180px;margin:0 auto 28px;position:relative;
  animation:heartBeat 1.25s infinite;
}
.hero-heart::before,.hero-heart::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle,rgba(255,45,80,.4),transparent 62%);
  filter:blur(4px);
}
.heart-shape{
  position:absolute;inset:23px;
  transform:rotate(-45deg);
  background:linear-gradient(135deg,#6e081e,#ff365b 48%,#8e0b25);
  border-radius:22px 0 22px 0;
  box-shadow:0 0 28px rgba(255,30,70,.75),0 0 80px rgba(150,0,35,.45);
}
.heart-shape::before,.heart-shape::after{
  content:"";position:absolute;background:inherit;border-radius:50%;width:100%;height:100%;
}
.heart-shape::before{top:-50%;left:0}
.heart-shape::after{left:50%;top:0}
.heart-core{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:38px;color:#ffdfe5;z-index:2;
  text-shadow:0 0 15px #ff8aa0;
}
@keyframes heartBeat{50%{transform:scale(1.08)}}
.hero-card{
  max-width:780px;margin:0 auto;
  padding:18px 22px 24px;
}
.hero-note{
  display:inline-block;margin:8px;
  padding:9px 15px;border:1px solid rgba(255,150,165,.25);
  border-radius:999px;color:#e3b1ba;background:rgba(50,0,12,.32);
  font-size:12px;letter-spacing:2px;text-transform:uppercase;
}

/* UNIVERSE */
.orbit{
  width:280px;height:280px;border:1px solid rgba(213,80,105,.15);
  border-radius:50%;margin:30px auto;position:relative;
  box-shadow:0 0 60px rgba(130,0,35,.12);
}
.orbit::before,.orbit::after{
  content:"";position:absolute;inset:30px;border-radius:50%;
  border:1px solid rgba(255,110,130,.18);animation:orbitSpin 16s linear infinite;
  pointer-events:none;
}
.orbit::after{inset:70px;border-color:rgba(255,180,110,.15);animation-duration:9s;animation-direction:reverse}
.orbit-star{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  z-index:10;
  pointer-events:auto;
  font-size:72px;filter:drop-shadow(0 0 20px #ff4868);
  cursor:pointer;animation:starFloat 2.2s ease-in-out infinite alternate;
}
@keyframes orbitSpin{to{transform:rotate(360deg)}}
@keyframes starFloat{to{transform:translate(-50%,-50%) scale(1.14) rotate(4deg)}}

/* PHRASES */
.quote-stage{
  width:min(760px,100%);margin:0 auto 30px;
  min-height:235px;display:flex;align-items:center;justify-content:center;
  padding:35px;
  border:1px solid rgba(255,80,110,.2);
  border-radius:32px;
  background:linear-gradient(145deg,rgba(62,2,15,.46),rgba(11,3,6,.7));
  box-shadow:inset 0 0 60px rgba(180,0,45,.05),0 20px 60px rgba(0,0,0,.28);
  position:relative;
}
.quote-mark{position:absolute;top:10px;left:26px;font-size:64px;color:#7d1028;opacity:.6}
.quote-text{font-size:clamp(24px,4vw,40px);line-height:1.5;color:#f7e8eb;max-width:640px}
.quote-progress{display:flex;justify-content:center;gap:7px;margin-top:18px}
.dot{width:8px;height:8px;border-radius:50%;background:#4b0d1d;transition:.3s}
.dot.active{background:#ff506d;box-shadow:0 0 12px #ff506d}

/* TIMELINE */
.timeline{
  display:grid;grid-template-columns:repeat(4,1fr);gap:20px;
  margin:45px auto 25px;max-width:1050px;
}
.time-card{
  min-height:190px;padding:26px 20px;
  border:1px solid rgba(255,90,115,.22);border-radius:24px;
  background:linear-gradient(160deg,rgba(68,3,17,.5),rgba(8,3,6,.78));
  cursor:pointer;transition:.35s;position:relative;overflow:hidden;
}
.time-card::before{
  content:"";position:absolute;inset:-40%;
  background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,55,80,.12),transparent 85%);
  animation:cardSpin 8s linear infinite;
}
.time-card>*{position:relative}
@keyframes cardSpin{to{transform:rotate(360deg)}}
.time-card:hover,.time-card.selected{transform:translateY(-8px);border-color:#ff5774;box-shadow:0 16px 40px rgba(120,0,30,.3)}
.time-num{color:#e4a0ac;letter-spacing:3px;font-size:12px}
.time-icon{font-size:34px;margin:14px 0}
.time-card h3{font-size:23px;margin-bottom:10px}
.time-detail{min-height:120px;max-width:750px;margin:20px auto;padding:26px;border-radius:24px;background:rgba(45,3,11,.45);border:1px solid rgba(255,80,105,.15);line-height:1.8;font-size:19px}

/* SEED/ROSE */
.garden{
  position:relative;width:min(720px,100%);height:330px;margin:12px auto 8px;
  display:flex;justify-content:center;align-items:end;
}
.ground{
  position:absolute;bottom:18px;width:300px;height:54px;border-radius:50%;
  background:radial-gradient(ellipse at center,#29110e,#0c0706 68%,transparent 70%);
  box-shadow:0 0 45px rgba(255,50,70,.08);
}
.seed-shape{
  width:22px;height:30px;border-radius:55% 45% 55% 45%;
  background:linear-gradient(135deg,#8b4d24,#2c120b);
  transform:rotate(25deg);box-shadow:0 0 12px rgba(205,106,60,.12);
  transition:.6s;
}
.sprout{
  position:absolute;bottom:53px;width:8px;height:140px;border-radius:999px;
  background:linear-gradient(#2f5f2d,#7aa54c);transform-origin:bottom;
  transform:scaleY(0);transition:1s;
}
.sprout::before,.sprout::after{
  content:"";position:absolute;width:55px;height:25px;border-radius:100% 0;
  background:linear-gradient(135deg,#2d5a28,#91bb5d);
}
.sprout::before{left:-45px;top:45px;transform:rotate(-22deg)}
.sprout::after{right:-45px;top:75px;transform:scaleX(-1) rotate(-22deg)}
.bloom{
  position:absolute;bottom:150px;font-size:110px;transform:scale(0);
  filter:drop-shadow(0 0 30px rgba(255,30,60,.75));
  transition:1.2s cubic-bezier(.2,.8,.2,1);
}
.garden.stage2 .sprout{transform:scaleY(1)}
.garden.stage2 .seed-shape{opacity:0;transform:scale(.65)}
.garden.stage3 .sprout{transform:scaleY(1.05)}
.garden.stage3 .bloom{transform:scale(1) rotate(-3deg)}
.rose-copy{
  max-width:720px;margin:0 auto;min-height:105px;line-height:1.8;
  font-size:20px;color:#eadcdf;
}

/* PUZZLE */
.puzzle-wrap{max-width:850px;margin:0 auto}
.puzzle-message{
  min-height:85px;font-size:30px;line-height:1.5;
  margin:25px 0;color:#ffe6eb;text-shadow:0 0 18px rgba(255,50,80,.3);
}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:13px}
.tile{
  padding:13px 20px;border-radius:18px;border:1px solid rgba(255,85,110,.27);
  background:rgba(48,3,13,.46);color:#fff;cursor:pointer;font:inherit;font-size:17px;
  transition:.3s;
}
.tile:hover{transform:translateY(-5px);border-color:#ff5974}
.tile.found{background:rgba(170,0,40,.5);border-color:#ff637c;box-shadow:0 0 22px rgba(255,40,70,.2);transform:scale(1.06)}
.tile.wrong{animation:wrong .35s}
@keyframes wrong{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* TORN LETTER */
.letter-scene{width:min(950px,100%);margin:auto}
.torn-letter{
  width:min(760px,100%);margin:18px auto 28px;
  display:grid;grid-template-columns:1fr 1fr;gap:15px;
}
.letter-piece{
  min-height:170px;padding:26px;position:relative;
  background:
    linear-gradient(145deg,#f3ddc5,#d8b48e);
  color:#3a1d18;text-align:left;
  box-shadow:0 20px 45px rgba(0,0,0,.4);
  border:1px solid rgba(110,60,35,.24);
  cursor:pointer;transition:.55s;
  clip-path:polygon(2% 6%,12% 2%,21% 5%,33% 1%,44% 5%,56% 2%,67% 6%,79% 1%,91% 6%,98% 3%,96% 20%,99% 36%,95% 49%,98% 64%,94% 79%,98% 95%,83% 97%,72% 94%,58% 98%,44% 95%,31% 98%,18% 94%,4% 98%,6% 82%,2% 69%,5% 54%,2% 39%,6% 22%);
}
.letter-piece::after{
  content:"";position:absolute;inset:8px;border:1px solid rgba(90,40,20,.13);pointer-events:none;
}
.letter-piece h3{font-size:23px;margin-bottom:12px;color:#6b2530}
.letter-piece p{font-size:16px;line-height:1.7}
.letter-piece.locked{filter:saturate(.4) brightness(.78)}
.letter-piece.found{transform:rotate(0)!important;filter:none;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.piece-a{transform:rotate(-2deg)}
.piece-b{transform:rotate(2deg)}
.piece-c{transform:rotate(2deg)}
.piece-d{transform:rotate(-2deg)}
.letter-status{color:#d8a7af;margin-bottom:16px}

/* FINAL */
.final{
  text-align:center;min-height:100vh;position:relative;
}
.final::before{
  content:"";position:absolute;width:850px;height:850px;left:50%;top:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,20,50,.28),rgba(140,0,30,.13) 30%,transparent 68%);
  filter:blur(14px);animation:finalPulse 5s ease-in-out infinite;
  z-index:-2;
}
@keyframes finalPulse{50%{transform:translate(-50%,-50%) scale(1.12);opacity:1}}
.final-heart-field{position:absolute;inset:0;pointer-events:none}
.final-title{font-size:clamp(55px,11vw,120px);line-height:.9;letter-spacing:2px}
.final-title span{display:block}
.final-title .small{font-size:clamp(23px,4vw,38px);letter-spacing:7px;color:#e6a7b2;margin-bottom:24px}
.final-text{max-width:700px;margin:30px auto;font-size:20px;line-height:1.9;color:#eadfe1}
.signature{font-size:27px;font-style:italic;color:#e2ad7c}
.final-rose{
  font-size:100px;margin:18px 0;
  filter:drop-shadow(0 0 30px rgba(255,35,65,.6));
  animation:finalRose 3.5s infinite ease-in-out;
}
@keyframes finalRose{50%{transform:translateY(-8px) rotate(2deg)}}

/* Responsive */
@media(max-width:850px){
  .timeline{grid-template-columns:1fr 1fr}
  .torn-letter{grid-template-columns:1fr}
  .badge{display:none}
}
@media(max-width:600px){
  .scene{padding:26px 16px}
  h1{font-size:44px}
  .subtitle{font-size:18px}
  .timeline{grid-template-columns:1fr}
  .orbit{width:230px;height:230px}
  .quote-stage{padding:26px;min-height:250px}
  .quote-text{font-size:25px}
  .garden{height:285px}
  .hero-heart{width:150px;height:150px}
}

/* Click sparkle */
.click-heart{
  position:fixed;z-index:100;pointer-events:none;
  color:#ff526f;font-size:18px;
  animation:clickHeart 1s ease-out forwards;
}
@keyframes clickHeart{to{transform:translateY(-80px) scale(1.25);opacity:0}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const name = "Ana Jackelin";
const frases = [
  "Me encanta hablar contigo, incluso cuando no tenemos nada importante que decir.",
  "Hay pequeños detalles tuyos que probablemente ni siquiera notas, pero yo sí.",
  "Me gusta tenerte en mi vida más de lo que imaginas.",
  "A veces apareces en mis pensamientos sin siquiera avisar.",
  "Y si tuviera que elegir nuevamente... probablemente volvería a encontrarte.",
  "Mi bebé, mi niña bonita, mi hermosa chinasha... no sabes lo especial que eres para mí. ❤️"
];

const momentos = [
  ["01","♥","El comienzo","Ese día todavía no sabía lo importante que ibas a llegar a ser para mí."],
  ["02","☾","Poco a poco","Empezaste a aparecer cada vez más en mis pensamientos... y también en mis días."],
  ["03","✦","Sin darme cuenta","Sin saber exactamente cuándo pasó, empezaste a convertirte en alguien demasiado especial para mí."],
  ["04","∞","Hoy","Me alegra muchísimo tenerte en mi vida, Ana Jackelin. ❤️"]
];

const piezas = [
  ["a","Mi niña bonita","Quiero que sepas que te quiero muchísimo. Sé que a veces te hago renegar feo jsjs."],
  ["b","No soy perfecto","Sé que tengo mis errores y mis cosas... pero de todo corazón quiero que sepas que me importas muchísimo."],
  ["c","Mis ojos siempre vuelven a ti","Siempre serás mi niña de ojos bonitos, preciosos... esa niña que tiene algo que no sé explicar."],
  ["d","La verdad jsjs","También eres esa que me tienta cada vez 😏, la que me hace pecar jsjsjs. Y aun así, más allá de todo, te quiero por ser tú."]
];

let scene = "inicio";
let quoteIndex = 0;
let timelineChosen = null;
let gardenStage = 1;
let foundTiles = [];
let letterFound = 0;
let petalTimer = null;

const app = document.getElementById("app");

function particles(kind="stars"){
  const wrap = document.createElement("div");
  wrap.className = kind;
  const count = kind==="petals" ? 18 : 30;
  for(let i=0;i<count;i++){
    const e=document.createElement("i");
    e.style.left=(Math.random()*100)+"%";
    e.style.top=(Math.random()*100)+"%";
    e.style.animationDuration=(kind==="petals"?6+Math.random()*8:5+Math.random()*9)+"s";
    e.style.animationDelay=(Math.random()*5)+"s";
    if(kind==="stars"){ e.style.animationDelay=(Math.random()*3)+"s"; }
    wrap.appendChild(e);
  }
  return wrap;
}

function setScene(id, content, extras=[]){
  scene = id;
  app.innerHTML = "";
  const s = document.createElement("section");
  s.className = "scene active";
  if(id==="final") s.classList.add("final");
  s.innerHTML = content;
  extras.forEach(e=>s.appendChild(e));
  app.appendChild(s);
  window.scrollTo({top:0,behavior:"smooth"});
  if(id==="rosa" || id==="final") startPetals();
}

function badges(){
  const frag=document.createDocumentFragment();
  [
    ["♥ mi bebé","badge-a"],
    ["✦ mi niña bonita","badge-b"],
    ["♡ mi hermosa","badge-c"],
    ["❦ mi chinasha","badge-d"]
  ].forEach(([t,c])=>{
    const d=document.createElement("div");
    d.className=`decor badge ${c}`; d.textContent=t;
    frag.appendChild(d);
  });
  return frag;
}

function startPetals(){
  if(petalTimer) clearInterval(petalTimer);
  const root=document.querySelector(".scene");
  if(!root) return;
  const layer=particles("petals");
  root.appendChild(layer);
  petalTimer=setInterval(()=>{
    if(scene!=="rosa" && scene!=="final"){
      clearInterval(petalTimer);petalTimer=null;return;
    }
    const p=document.createElement("i");
    p.style.left=(Math.random()*100)+"%";
    p.style.animationDuration=(6+Math.random()*7)+"s";
    p.style.animationDelay="0s";
    layer.appendChild(p);
    setTimeout(()=>p.remove(),14000);
  },650);
}

function sparkle(x,y){
  const h=document.createElement("div");
  h.className="click-heart";
  h.textContent=["♥","♡","✦","❦"][Math.floor(Math.random()*4)];
  h.style.left=x+"px";h.style.top=y+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),1000);
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,.hero-heart,.orbit-star,.bloom,.seed-shape,.sprout,.tile,.letter-piece");
  if(t) sparkle(e.clientX,e.clientY);
});

function renderInicio(){
  const extra=[particles("stars"),badges()];
  setScene("inicio",`
    <div class="scene-inner hero-card">
      <div class="eyebrow">PARA TI</div>
      <div class="hero-heart"><div class="heart-shape"></div><div class="heart-core">♥</div></div>
      <h1 class="romantic-title">Hola, mi niña bonita</h1>
      <p class="subtitle">Hice esto pensando en ti, Ana Jackelin.<br><span class="gold">No quiero que lo leas de golpe... quiero que lo descubras.</span></p>
      <div>
        <span class="hero-note">♥ mi bebé</span>
        <span class="hero-note">✦ ojos bonitos</span>
        <span class="hero-note">❦ hecha para ti</span>
      </div>
      <br>
      <button class="btn" id="startBtn">Entrar a nuestro pequeño universo ✨</button>
    </div>`,extra);
  document.getElementById("startBtn").onclick=renderUniverso;
}

function renderUniverso(){
  setScene("universo",`
    <div class="scene-inner">
      <div class="eyebrow">NUESTRO UNIVERSO</div>
      <h1 class="romantic-title">Entre millones de estrellas...</h1>
      <p class="subtitle">Hay cosas que parecen imposibles hasta que sucede algo pequeño que cambia todo.</p>
      <div class="orbit"><div class="orbit-star" id="starBtn">✦</div></div>
      <p id="universeText" class="subtitle" style="min-height:55px">Toca la estrella que está en el centro...</p>
    </div>`,[particles("stars"),badges()]);
  document.getElementById("starBtn").onclick=()=>{
    document.getElementById("universeText").innerHTML=
      `Y entre todas esas estrellas...<br><strong class="red">tuve la suerte de encontrarte a ti. ❤️</strong><br><br>
      <button class="btn" id="toHeart">Seguir descubriendo ✨</button>`;
    document.getElementById("toHeart").onclick=renderHeart;
  };
}

function renderHeart(){
  setScene("heart",`
    <div class="scene-inner">
      <div class="eyebrow">ESTE CORAZÓN</div>
      <div class="hero-heart" id="heartTap"><div class="heart-shape"></div><div class="heart-core">♥</div></div>
      <h1>Late por ti.</h1>
      <p class="subtitle">Tócalo y deja que te diga lo que no siempre sé explicar.</p>
      <button class="btn" id="heartBtn">Tocar mi corazón ❤️</button>
      <div id="heartResult" style="margin-top:24px;min-height:50px"></div>
    </div>`,[particles("stars"),badges()]);
  let taps=0;
  const reveal=()=>{
    taps++;
    document.getElementById("heartResult").innerHTML=
      `<p class="subtitle" style="margin-bottom:16px">Late porque tú apareces en mis pensamientos más veces de las que imaginas.</p>
       ${taps>=2?'<button class="btn" id="phrasesNext">Quiero más de ti ✦</button>':''}`;
    if(taps>=2) document.getElementById("phrasesNext").onclick=renderPhrases;
  };
  document.getElementById("heartBtn").onclick=reveal;
  document.getElementById("heartTap").onclick=reveal;
}

function renderPhrases(){
  quoteIndex=0;
  setScene("frases",`
    <div class="scene-inner">
      <div class="eyebrow">PEQUEÑAS FRASES</div>
      <h1 class="romantic-title">Para ti</h1>
      <div class="quote-stage">
        <div class="quote-mark">“</div>
        <div class="quote-text" id="quoteText">${frases[0]}</div>
      </div>
      <div class="quote-progress" id="quoteProgress">${frases.map((_,i)=>`<i class="dot ${i===0?"active":""}"></i>`).join("")}</div>
      <br>
      <button class="btn" id="nextQuote">Otra frase ♥</button>
      <div id="quoteEnd" style="margin-top:18px"></div>
    </div>`,[particles("stars"),badges()]);
  const update=()=>{
    quoteIndex++;
    if(quoteIndex<frases.length){
      document.getElementById("quoteText").animate([{opacity:0,transform:"translateY(15px)"},{opacity:1,transform:"none"}],{duration:450,easing:"ease-out"});
      document.getElementById("quoteText").textContent=frases[quoteIndex];
      [...document.querySelectorAll(".dot")].forEach((d,i)=>d.classList.toggle("active",i===quoteIndex));
    }else{
      document.getElementById("nextQuote").disabled=true;
      document.getElementById("quoteEnd").innerHTML='<button class="btn" id="storyNext">Entrar en nuestra historia 🌹</button>';
      document.getElementById("storyNext").onclick=renderTimeline;
    }
  };
  document.getElementById("nextQuote").onclick=update;
}

function renderTimeline(){
  setScene("historia",`
    <div class="scene-inner">
      <div class="eyebrow">NUESTRA HISTORIA</div>
      <h1 class="romantic-title">Pequeños momentos, enormes sentimientos</h1>
      <p class="subtitle">Toca cada recuerdo. El último abre el siguiente capítulo.</p>
      <div class="timeline">${momentos.map((m,i)=>`
        <div class="time-card" data-i="${i}">
          <div class="time-num">${m[0]}</div>
          <div class="time-icon">${m[1]}</div>
          <h3>${m[2]}</h3>
          <p style="color:#bfaab0;font-size:14px">Tocar para recordar</p>
        </div>`).join("")}</div>
      <div id="timeDetail" class="time-detail">Empieza por cualquiera... ❤️</div>
    </div>`,[particles("stars"),badges()]);
  document.querySelectorAll(".time-card").forEach(card=>{
    card.onclick=()=>{
      const i=Number(card.dataset.i);
      document.querySelectorAll(".time-card").forEach(c=>c.classList.remove("selected"));
      card.classList.add("selected");
      const m=momentos[i];
      document.getElementById("timeDetail").innerHTML=
        `<strong class="red">${m[2]}</strong><br><br>${m[3]}${i===3?'<br><br><button class="btn" id="roseNext">Ver lo que creció desde entonces 🌹</button>':''}`;
      if(i===3) document.getElementById("roseNext").onclick=renderRose;
    };
  });
}

function renderRose(){
  gardenStage=1;
  setScene("rosa",`
    <div class="scene-inner">
      <div class="eyebrow">PARA MI NIÑA BONITA</div>
      <h1>Hay algo que quiero regalarte...</h1>
      <p class="subtitle">No es una rosa cualquiera. Primero tienes que ayudarla a crecer.</p>
      <div class="garden stage1" id="garden">
        <div class="ground"></div>
        <div class="seed-shape" id="seed"></div>
        <div class="sprout" id="sprout"></div>
        <div class="bloom" id="bloom">🌹</div>
      </div>
      <div class="rose-copy" id="roseCopy">Toca la semilla. Algunas de las cosas más bonitas empiezan sin que nadie las note.</div>
      <br>
      <button class="btn" id="growBtn">Hacerla crecer 🌱</button>
    </div>`,[particles("stars"),badges()]);
  const grow=()=>{
    gardenStage++;
    const g=document.getElementById("garden");
    if(gardenStage===2){
      g.className="garden stage2";
      document.getElementById("roseCopy").textContent="Con cuidado, paciencia y cariño, empieza a crecer algo que antes parecía muy pequeño.";
      document.getElementById("growBtn").textContent="Seguir cuidándola ✦";
    }else if(gardenStage===3){
      g.className="garden stage3";
      document.getElementById("roseCopy").innerHTML="Y cuando florece... <strong class='red'>me recuerda a ti.</strong> Bonita, intensa y capaz de cambiar el ambiente completo de un día.";
      document.getElementById("growBtn").textContent="Hay algo escondido... ♥";
    }else{
      document.getElementById("growBtn").onclick=renderPuzzle;
      document.getElementById("growBtn").click();
      return;
    }
  };
  document.getElementById("growBtn").onclick=grow;
}

function renderPuzzle(){
  foundTiles=[]; const target=["TÚ","ERES","MI","NIÑA","BONITA","♥"];
  const shuffled=["BONITA","MI","TÚ","♥","LINDA","CORAZÓN","ERES","NIÑA"];
  setScene("puzzle",`
    <div class="scene-inner puzzle-wrap">
      <div class="eyebrow">UN MENSAJE SECRETO</div>
      <h1>Descubre lo que quiero decirte</h1>
      <p class="subtitle">No tienes que adivinarlo. Solo toca las palabras en el orden correcto.</p>
      <div class="puzzle-message" id="puzzleMessage">...</div>
      <div class="tiles">${shuffled.map(w=>`<button class="tile" data-word="${w}">${w}</button>`).join("")}</div>
      <p id="puzzleHint" class="subtitle" style="margin-top:24px">Empieza por la primera palabra ✦</p>
    </div>`,[particles("stars"),badges()]);
  document.querySelectorAll(".tile").forEach(t=>{
    t.onclick=()=>{
      const w=t.dataset.word;
      if(w===target[foundTiles.length]){
        foundTiles.push(w); t.classList.add("found");t.disabled=true;
        document.getElementById("puzzleMessage").textContent=foundTiles.join(" ");
        if(foundTiles.length===target.length){
          document.getElementById("puzzleHint").innerHTML='Lo encontraste... ❤️<br><br><button class="btn" id="letterNext">Abrir lo que guardé en una carta 💌</button>';
          document.getElementById("letterNext").onclick=renderLetter;
        }else document.getElementById("puzzleHint").textContent="Muy bien. Busca la siguiente ✦";
      }else{
        t.classList.remove("wrong");void t.offsetWidth;t.classList.add("wrong");
        document.getElementById("puzzleHint").textContent="Esa no es todavía... busca otra 💕";
      }
    };
  });
}

function renderLetter(){
  letterFound=0;
  setScene("carta",`
    <div class="scene-inner letter-scene">
      <div class="eyebrow">UNA CARTA PARA TI</div>
      <h1 class="romantic-title">Pedacitos de lo que siento</h1>
      <p class="subtitle">La carta está rota en cuatro partes. Toca cada pedazo para volver a encontrarla.</p>
      <div class="torn-letter">
        ${piezas.map((p,i)=>`<div class="letter-piece piece-${p[0]} locked" data-piece="${i}"><h3>${p[1]}</h3><p>${p[2]}</p></div>`).join("")}
      </div>
      <p id="letterStatus" class="letter-status">0 de 4 recuerdos encontrados</p>
      <button class="btn" id="assembleBtn" disabled>Armar la carta ♥</button>
    </div>`,[particles("stars")]);
  document.querySelectorAll(".letter-piece").forEach(piece=>{
    piece.onclick=()=>{
      if(piece.classList.contains("found")) return;
      piece.classList.remove("locked");piece.classList.add("found");
      letterFound++;
      document.getElementById("letterStatus").textContent=`${letterFound} de 4 recuerdos encontrados`;
      if(letterFound===4) document.getElementById("assembleBtn").disabled=false;
    };
  });
  document.getElementById("assembleBtn").onclick=renderFullLetter;
}

function renderFullLetter(){
  setScene("fullLetter",`
    <div class="scene-inner letter-scene">
      <div class="eyebrow">PARA TI, ANA JACKELIN</div>
      <h1>Mi niña bonita ❤️</h1>
      <div class="torn-letter" style="grid-template-columns:1fr">
        <div class="letter-piece found" style="cursor:default">
          <h3>Mi bebé...</h3>
          <p>Quiero que sepas que te quiero muchísimo. Y sé que a veces te hago renegar feo jsjs, sé que no soy perfecto y que también tengo mis errores y mis cosas.</p>
          <p>Pero de todo corazón quiero que sepas algo: <strong>me importas muchísimo.</strong> A pesar de todo lo que pasa, siempre vas a ser alguien demasiado especial para mí.</p>
          <p>Siempre serás mi niña de ojos bonitos, preciosos... esa niña que tiene algo que no sé explicar, pero que hace que cada vez me gustes más. ❤️</p>
          <p>Y sí... también eres esa que me tienta cada vez 😏, la que me hace pecar jsjsjs.</p>
          <p>Pero más allá de todo eso, quiero que sepas que te quiero por ser tú, por esos pequeños detalles que quizá ni siquiera notas y por todo lo que haces sentir en mí.</p>
          <p style="text-align:center;font-size:24px;font-weight:bold;color:#8a1830">Te quiero mucho, mi bebé. ❤️</p>
          <p style="text-align:right;font-style:italic">— David</p>
        </div>
      </div>
      <button class="btn" id="finalNext">Una última cosa... ❤️‍🔥</button>
    </div>`,[particles("stars"),badges()]);
  document.getElementById("finalNext").onclick=renderFinal;
}

function renderFinal(){
  const extra=[particles("stars"),badges()];
  setScene("final",`
    <div class="final-heart-field"></div>
    <div class="scene-inner">
      <div class="eyebrow">ANA JACKELIN...</div>
      <div class="final-rose">🌹</div>
      <h1 class="final-title"><span class="small">PARA TI</span><span>TE QUIERO</span><span>MUCHÍSIMO. ♥</span></h1>
      <p class="final-text">No importa cuántas veces te haga renegar, cuántos errores tenga o cuántas cosas pasen. <strong class="red">Siempre vas a ser mi niña bonita, mi bebé, mi hermosa chinasha.</strong><br><br>Gracias por existir y por formar parte de mi historia.</p>
      <div class="signature">— David ❤️</div>
      <br><br>
      <button class="btn" id="replay">Volver a vivirlo ↺</button>
    </div>`,extra);
  const field=document.querySelector(".final-heart-field");
  for(let i=0;i<38;i++){
    const h=document.createElement("span");
    h.textContent=["♥","♡","✦","❦"][Math.floor(Math.random()*4)];
    h.style.position="absolute";
    h.style.left=(Math.random()*100)+"%";
    h.style.top=(Math.random()*100)+"%";
    h.style.fontSize=(14+Math.random()*34)+"px";
    h.style.color=Math.random()>.45?"#ff3f61":"#b41839";
    h.style.opacity=(.15+Math.random()*.7).toFixed(2);
    h.style.filter="drop-shadow(0 0 8px rgba(255,40,70,.5))";
    h.style.animation=`floaty ${5+Math.random()*5}s ${Math.random()*3}s infinite ease-in-out`;
    field.appendChild(h);
  }
  document.getElementById("replay").onclick=renderInicio;
}

renderInicio();
</script>
</body>
</html>
